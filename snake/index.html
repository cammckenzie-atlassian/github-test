<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      letter-spacing: 4px;
      color: #4ecca3;
    }

    #hud {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1rem;
      color: #aaa;
    }

    #hud span { color: #fff; font-weight: bold; }

    canvas {
      border: 2px solid #4ecca3;
      border-radius: 4px;
      background: #16213e;
      display: block;
    }

    #message {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #888;
      min-height: 1.4em;
    }

    #message.active { color: #4ecca3; }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud">
    Score: <span id="score">0</span>&nbsp;&nbsp; High Score: <span id="highscore">0</span>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <p id="message">Press <strong>Space</strong> or <strong>Enter</strong> to start</p>

  <script src="snake.js"></script>
</body>
</html>
