<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      user-select: none;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #scoreboard {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1.2rem;
      font-size: 1rem;
      color: #a0a0b8;
    }

    #scoreboard span { font-weight: 600; color: #e0e0e0; }

    #game-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border-radius: 12px;
      border: 2px solid #2a2a3e;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.15);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(15, 15, 26, 0.88);
      backdrop-filter: blur(4px);
      gap: 1rem;
      transition: opacity 0.3s;
    }

    #overlay.hidden { opacity: 0; pointer-events: none; }

    #overlay h2 {
      font-size: 2rem;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #overlay p { font-size: 1rem; color: #a0a0b8; text-align: center; }

    #overlay .final-score {
      font-size: 1.4rem;
      color: #e0e0e0;
      font-weight: 700;
    }

    #play-btn {
      margin-top: 0.5rem;
      padding: 0.7rem 2.4rem;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      color: #0f0f1a;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.2s, transform 0.1s;
    }

    #play-btn:hover { opacity: 0.9; transform: scale(1.03); }
    #play-btn:active { transform: scale(0.97); }

    #controls {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: #4a4a6a;
      text-align: center;
    }

    /* mobile d-pad */
    #dpad {
      display: none;
      margin-top: 1.2rem;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 4px;
      width: 160px;
      height: 160px;
    }

    @media (pointer: coarse) { #dpad { display: grid; } }

    .dpad-btn {
      background: #1e1e32;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #a0a0b8;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active { background: #2a2a4e; }
    .dpad-btn.center { background: transparent; border: none; pointer-events: none; }
  </style>
</head>
<body>

<h1>🐍 SNAKE</h1>

<div id="scoreboard">
  Score: <span id="score-val">0</span>
  &nbsp;|&nbsp;
  Best: <span id="best-val">0</span>
  &nbsp;|&nbsp;
  Level: <span id="level-val">1</span>
</div>

<div id="game-wrapper">
  <canvas id="canvas" width="420" height="420"></canvas>

  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-msg">Use arrow keys or WASD to move</p>
    <div id="final-score-display" class="final-score" style="display:none"></div>
    <button id="play-btn">▶ START</button>
  </div>
</div>

<div id="controls">Arrow keys / WASD &nbsp;·&nbsp; P to pause</div>

<div id="dpad">
  <div></div>
  <button class="dpad-btn" id="btn-up">▲</button>
  <div></div>
  <button class="dpad-btn" id="btn-left">◀</button>
  <div class="dpad-btn center"></div>
  <button class="dpad-btn" id="btn-right">▶</button>
  <div></div>
  <button class="dpad-btn" id="btn-down">▼</button>
  <div></div>
</div>

<script>
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');

  const COLS = 21, ROWS = 21;
  const CELL = canvas.width / COLS;   // 20px

  // State
  let snake, dir, nextDir, food, score, best, level, speed, loop, state, particles;
  // state: 'idle' | 'playing' | 'paused' | 'dead'

  best = parseInt(localStorage.getItem('snakeBest') || '0');
  document.getElementById('best-val').textContent = best;

  /* ─── Init ─────────────────────────────────────────── */
  function init() {
    snake    = [{x:10, y:10},{x:9,y:10},{x:8,y:10}];
    dir      = {x:1, y:0};
    nextDir  = {x:1, y:0};
    food     = randomFood();
    score    = 0;
    level    = 1;
    speed    = 140;
    particles = [];
    updateHUD();
  }

  function randomFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
    } while (snake.some(s => s.x===pos.x && s.y===pos.y));
    return pos;
  }

  /* ─── Game loop ─────────────────────────────────────── */
  function startLoop() {
    clearTimeout(loop);
    loop = setTimeout(() => {
      if (state === 'playing') { tick(); startLoop(); }
    }, speed);
  }

  function tick() {
    dir = { ...nextDir };

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { return die(); }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) { return die(); }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      spawnParticles(food.x, food.y);
      food = randomFood();
      level = Math.floor(score / 5) + 1;
      speed = Math.max(60, 140 - (level - 1) * 8);
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', best);
      }
      updateHUD();
    } else {
      snake.pop();
    }

    render();
  }

  /* ─── Render ────────────────────────────────────────── */
  function render() {
    // Background grid
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
    }

    // Particles
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.globalAlpha = p.life / 30;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      p.x += p.vx; p.y += p.vy; p.life--;
    });
    ctx.globalAlpha = 1;

    // Food
    const fx = food.x * CELL + CELL/2;
    const fy = food.y * CELL + CELL/2;
    const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 200);
    const fr = (CELL/2 - 2) * pulse;

    const foodGrad = ctx.createRadialGradient(fx - fr*0.3, fy - fr*0.3, fr*0.1, fx, fy, fr);
    foodGrad.addColorStop(0, '#ff6b6b');
    foodGrad.addColorStop(1, '#c0392b');
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = foodGrad;
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur  = 0;

    // Snake
    snake.forEach((seg, i) => {
      const t  = i / snake.length;
      const sx = seg.x * CELL;
      const sy = seg.y * CELL;
      const pad = 1.5;
      const r = 4;

      // Gradient from head (green) → tail (teal-blue)
      const gr = Math.round(174 + (0 - 174) * t);
      const gg = Math.round(222 + (195 - 222) * t);
      const gb = Math.round(128 + (200 - 128) * t);
      const alpha = 1 - t * 0.35;

      ctx.globalAlpha = alpha;
      ctx.fillStyle = `rgb(${gr},${gg},${gb})`;

      if (i === 0) {
        // Head glow
        ctx.shadowColor = '#4ade80';
        ctx.shadowBlur  = 10;
      }

      roundRect(ctx, sx+pad, sy+pad, CELL-pad*2, CELL-pad*2, r);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eyes on head
      if (i === 0) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#0f0f1a';
        const ex = dir.x, ey = dir.y;
        const cx1 = sx + CELL/2 + (ey !== 0 ? -3 : ex * 3);
        const cy1 = sy + CELL/2 + (ex !== 0 ? -3 : ey * 3);
        const cx2 = sx + CELL/2 + (ey !== 0 ?  3 : ex * 3);
        const cy2 = sy + CELL/2 + (ex !== 0 ?  3 : ey * 3);
        ctx.beginPath(); ctx.arc(cx1, cy1, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx2, cy2, 2, 0, Math.PI*2); ctx.fill();
      }
    });

    ctx.globalAlpha = 1;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  /* ─── Particles ─────────────────────────────────────── */
  function spawnParticles(gx, gy) {
    const cx = gx * CELL + CELL/2;
    const cy = gy * CELL + CELL/2;
    const colors = ['#ff6b6b','#ffd93d','#ff9f43','#fff'];
    for (let i = 0; i < 14; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd   = 1 + Math.random() * 2.5;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        r: 1.5 + Math.random() * 2.5,
        life: 20 + Math.random() * 10,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  /* ─── Die / Overlay ─────────────────────────────────── */
  function die() {
    state = 'dead';
    clearTimeout(loop);

    // flash the snake red briefly
    flashDead();

    setTimeout(() => {
      document.getElementById('overlay-title').textContent = '💀 GAME OVER';
      document.getElementById('overlay-msg').textContent = 'Better luck next time!';
      const fs = document.getElementById('final-score-display');
      fs.style.display = 'block';
      fs.textContent = `Score: ${score}  ·  Best: ${best}`;
      document.getElementById('play-btn').textContent = '↩ PLAY AGAIN';
      showOverlay();
    }, 350);
  }

  function flashDead() {
    let flashes = 0;
    const flash = setInterval(() => {
      ctx.fillStyle = `rgba(255,50,50,${flashes % 2 === 0 ? 0.3 : 0})`;
      ctx.fillRect(0,0,canvas.width,canvas.height);
      if (++flashes >= 6) clearInterval(flash);
    }, 60);
  }

  function showOverlay() {
    document.getElementById('overlay').classList.remove('hidden');
  }

  function hideOverlay() {
    document.getElementById('overlay').classList.add('hidden');
  }

  /* ─── HUD ────────────────────────────────────────────── */
  function updateHUD() {
    document.getElementById('score-val').textContent = score;
    document.getElementById('best-val').textContent  = best;
    document.getElementById('level-val').textContent = level;
  }

  /* ─── Controls ───────────────────────────────────────── */
  const DIRS = {
    ArrowUp:    {x:0,y:-1}, ArrowDown:  {x:0,y:1},
    ArrowLeft:  {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0}
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
    const d = DIRS[e.key];
    if (!d) return;
    e.preventDefault();
    if (state !== 'playing') return;
    // Prevent reversing
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      clearTimeout(loop);
      document.getElementById('overlay-title').textContent = '⏸ PAUSED';
      document.getElementById('overlay-msg').textContent   = 'Press P or click Resume';
      document.getElementById('final-score-display').style.display = 'none';
      document.getElementById('play-btn').textContent = '▶ RESUME';
      showOverlay();
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      startLoop();
    }
  }

  document.getElementById('play-btn').addEventListener('click', () => {
    if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      startLoop();
    } else {
      init();
      state = 'playing';
      hideOverlay();
      render();
      startLoop();
    }
  });

  // D-pad
  const dpadMap = {
    'btn-up':    {x:0,y:-1}, 'btn-down':  {x:0,y:1},
    'btn-left':  {x:-1,y:0}, 'btn-right': {x:1,y:0}
  };
  Object.entries(dpadMap).forEach(([id, d]) => {
    document.getElementById(id).addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') return;
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
    }, {passive: false});
  });

  /* ─── Boot ───────────────────────────────────────────── */
  state = 'idle';
  init();
  render();
  // Draw idle frame
  document.getElementById('final-score-display').style.display = 'none';
</script>
</body>
</html>
