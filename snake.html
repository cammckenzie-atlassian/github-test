<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      user-select: none;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 12px;
      color: #4ecca3;
      text-transform: uppercase;
      text-shadow: 0 0 20px #4ecca355;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    #scoreboard span { color: #aaa; }
    #scoreboard strong { color: #4ecca3; font-size: 1.2rem; }

    #canvas-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 3px solid #4ecca344;
      border-radius: 6px;
      box-shadow: 0 0 40px #4ecca322;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 46, 0.88);
      border-radius: 4px;
      gap: 12px;
    }

    #overlay h2 { font-size: 2rem; color: #e94560; letter-spacing: 2px; }
    #overlay p  { color: #aaa; font-size: 0.95rem; }

    #overlay button {
      margin-top: 8px;
      padding: 12px 36px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #overlay button:hover  { background: #38b892; }
    #overlay button:active { transform: scale(0.97); }

    #controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
    }

    .ctrl-btn {
      background: #16213e;
      border: 2px solid #4ecca344;
      border-radius: 6px;
      color: #4ecca3;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn:active, .ctrl-btn.active { background: #4ecca344; }

    #ctrl-up    { grid-column: 2; grid-row: 1; }
    #ctrl-left  { grid-column: 1; grid-row: 2; }
    #ctrl-down  { grid-column: 2; grid-row: 2; }
    #ctrl-right { grid-column: 3; grid-row: 2; }

    #hint {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<h1>🐍 Snake</h1>

<div id="scoreboard">
  <div><span>SCORE </span><strong id="score">0</strong></div>
  <div><span>BEST &nbsp;</span><strong id="best">0</strong></div>
  <div><span>LEVEL </span><strong id="level">1</strong></div>
</div>

<div id="canvas-wrapper">
  <canvas id="game" width="420" height="420"></canvas>

  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-msg">Use arrow keys or the buttons below to move.</p>
    <button id="start-btn">START GAME</button>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="ctrl-up"    aria-label="Up">▲</button>
  <button class="ctrl-btn" id="ctrl-left"  aria-label="Left">◀</button>
  <button class="ctrl-btn" id="ctrl-down"  aria-label="Down">▼</button>
  <button class="ctrl-btn" id="ctrl-right" aria-label="Right">▶</button>
</div>

<div id="hint">ARROW KEYS · WASD · OR TAP BUTTONS</div>

<script>
(() => {
  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const CELL    = 20;
  const COLS    = canvas.width  / CELL;   // 21
  const ROWS    = canvas.height / CELL;   // 21

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const oTitle  = document.getElementById('overlay-title');
  const oMsg    = document.getElementById('overlay-msg');
  const startBtn= document.getElementById('start-btn');

  // ── Palette ──────────────────────────────────────────────
  const CLR = {
    bg:        '#1a1a2e',
    grid:      '#16213e',
    snakeHead: '#4ecca3',
    snakeBody: '#38b892',
    snakeDark: '#2a9d8f',
    food:      '#e94560',
    foodGlow:  '#e9456066',
    bonus:     '#f5a623',
    bonusGlow: '#f5a62366',
    text:      '#eee',
  };

  // ── State ─────────────────────────────────────────────────
  let snake, dir, nextDir, food, bonus, score, best, level, speed, loopId, frame;
  let bonusTimer = 0, bonusMax = 120, running = false;

  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  bestEl.textContent = best;

  // ── Init / Reset ──────────────────────────────────────────
  function init() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    level   = 1;
    speed   = 8;            // ticks per second
    frame   = 0;
    bonus   = null;
    bonusTimer = 0;
    food    = spawnFood();
    scoreEl.textContent = score;
    levelEl.textContent = level;
  }

  // ── Food helpers ──────────────────────────────────────────
  function randomCell() {
    return { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  }

  function occupied(cell) {
    return snake.some(s => s.x === cell.x && s.y === cell.y);
  }

  function spawnFood() {
    let cell;
    do { cell = randomCell(); } while (occupied(cell));
    return cell;
  }

  function maybeSpawnBonus() {
    if (!bonus && score > 0 && score % 50 === 0) {
      let cell;
      do { cell = randomCell(); } while (occupied(cell) || (cell.x === food.x && cell.y === food.y));
      bonus = cell;
      bonusTimer = bonusMax;
    }
  }

  // ── Game Loop ─────────────────────────────────────────────
  const TICK = 1000 / 60;   // ~60 fps render
  let lastTime = 0, accumulator = 0;

  function loop(ts) {
    loopId = requestAnimationFrame(loop);
    const dt = ts - lastTime;
    lastTime = ts;
    accumulator += dt;

    const tickMs = 1000 / speed;
    while (accumulator >= tickMs) {
      accumulator -= tickMs;
      tick();
    }

    draw();
  }

  function tick() {
    frame++;

    // commit next direction
    dir = { ...nextDir };

    const head  = snake[0];
    const newHead = {
      x: (head.x + dir.x + COLS) % COLS,
      y: (head.y + dir.y + ROWS) % ROWS,
    };

    // self-collision
    if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
      return gameOver();
    }

    snake.unshift(newHead);

    // eat regular food
    if (newHead.x === food.x && newHead.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      food = spawnFood();
      maybeSpawnBonus();
      updateLevel();
    } else if (bonus && newHead.x === bonus.x && newHead.y === bonus.y) {
      // eat bonus food
      score += 50;
      scoreEl.textContent = score;
      bonus = null;
      bonusTimer = 0;
      updateLevel();
    } else {
      snake.pop();
    }

    // bonus timer countdown
    if (bonus) {
      bonusTimer--;
      if (bonusTimer <= 0) bonus = null;
    }
  }

  function updateLevel() {
    const newLevel = Math.floor(score / 100) + 1;
    if (newLevel !== level) {
      level = newLevel;
      levelEl.textContent = level;
      speed = 8 + (level - 1) * 1.5;
    }
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
  }

  // ── Drawing ───────────────────────────────────────────────
  function draw() {
    // background
    ctx.fillStyle = CLR.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid lines (subtle)
    ctx.strokeStyle = CLR.grid;
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= canvas.width; x += CELL) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += CELL) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // bonus food (pulsing)
    if (bonus) {
      const pulse = 0.5 + 0.5 * Math.sin(frame * 0.25);
      ctx.shadowColor = CLR.bonusGlow;
      ctx.shadowBlur  = 10 + pulse * 10;
      ctx.fillStyle   = CLR.bonus;
      drawRoundRect(bonus.x * CELL + 2, bonus.y * CELL + 2, CELL - 4, CELL - 4, 4);
      ctx.shadowBlur  = 0;

      // countdown arc
      const ratio = bonusTimer / bonusMax;
      ctx.strokeStyle = CLR.bonus;
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.arc(bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2,
              CELL / 2 - 1, -Math.PI / 2, -Math.PI / 2 + ratio * 2 * Math.PI);
      ctx.stroke();
    }

    // regular food (pulsing glow)
    const foodPulse = 0.5 + 0.5 * Math.sin(frame * 0.15);
    ctx.shadowColor = CLR.foodGlow;
    ctx.shadowBlur  = 8 + foodPulse * 8;
    ctx.fillStyle   = CLR.food;
    drawCircle(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2);
    ctx.shadowBlur  = 0;

    // snake body
    for (let i = snake.length - 1; i >= 1; i--) {
      const t   = i / snake.length;
      ctx.fillStyle = lerpColor(CLR.snakeBody, CLR.snakeDark, t);
      drawRoundRect(snake[i].x * CELL + 1, snake[i].y * CELL + 1, CELL - 2, CELL - 2, 4);
    }

    // snake head
    ctx.shadowColor = '#4ecca366';
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = CLR.snakeHead;
    drawRoundRect(snake[0].x * CELL, snake[0].y * CELL, CELL, CELL, 5);
    ctx.shadowBlur  = 0;

    // eyes
    drawEyes(snake[0], dir);
  }

  function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
  }

  function drawCircle(cx, cy, r) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEyes(head, d) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;

    // Perpendicular offset for the two eyes
    const perp = { x: -d.y, y: d.x };
    const eyeOffset = 4;
    const fwdOffset = 3;
    const eyeR = 2;

    const e1 = { x: cx + d.x * fwdOffset + perp.x * eyeOffset,
                 y: cy + d.y * fwdOffset + perp.y * eyeOffset };
    const e2 = { x: cx + d.x * fwdOffset - perp.x * eyeOffset,
                 y: cy + d.y * fwdOffset - perp.y * eyeOffset };

    ctx.fillStyle = '#1a1a2e';
    drawCircle(e1.x, e1.y, eyeR);
    drawCircle(e2.x, e2.y, eyeR);
  }

  // ── Helpers ───────────────────────────────────────────────
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b];
  }

  function lerpColor(a, b, t) {
    const [ar, ag, ab] = hexToRgb(a);
    const [br, bg, bb] = hexToRgb(b);
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl= Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
  }

  // ── Game Over ─────────────────────────────────────────────
  function gameOver() {
    running = false;
    cancelAnimationFrame(loopId);
    oTitle.textContent  = 'GAME OVER';
    oMsg.textContent    = `Score: ${score}  •  Best: ${best}`;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.style.display = 'flex';
  }

  // ── Start ─────────────────────────────────────────────────
  function startGame() {
    overlay.style.display = 'none';
    init();
    running   = true;
    lastTime  = performance.now();
    accumulator = 0;
    loopId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);

  // ── Keyboard Controls ─────────────────────────────────────
  const KEY_MAP = {
    ArrowUp:    { x:  0, y: -1 }, w: { x:  0, y: -1 },
    ArrowDown:  { x:  0, y:  1 }, s: { x:  0, y:  1 },
    ArrowLeft:  { x: -1, y:  0 }, a: { x: -1, y:  0 },
    ArrowRight: { x:  1, y:  0 }, d: { x:  1, y:  0 },
  };

  document.addEventListener('keydown', e => {
    const d = KEY_MAP[e.key];
    if (d) {
      e.preventDefault();
      if (!running) { startGame(); return; }
      // prevent reversing
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    }
  });

  // ── Touch / Button Controls ───────────────────────────────
  function setDir(d) {
    if (!running) { startGame(); return; }
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }

  document.getElementById('ctrl-up')   .addEventListener('click', () => setDir({ x: 0, y:-1 }));
  document.getElementById('ctrl-down') .addEventListener('click', () => setDir({ x: 0, y: 1 }));
  document.getElementById('ctrl-left') .addEventListener('click', () => setDir({ x:-1, y: 0 }));
  document.getElementById('ctrl-right').addEventListener('click', () => setDir({ x: 1, y: 0 }));

  // ── Swipe Support ─────────────────────────────────────────
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    } else {
      setDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    }
  }, { passive: true });

  // Initial draw so it looks nice before the game starts
  init();
  draw();
})();
</script>
</body>
</html>
