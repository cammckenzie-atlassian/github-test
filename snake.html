<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 0.15em;
      color: #4ade80;
      text-shadow: 0 0 18px #4ade8088;
      margin-bottom: 10px;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
      color: #a0a0b0;
    }

    #scoreboard span { font-weight: 700; color: #fff; }

    #game-wrapper {
      position: relative;
      border: 2px solid #4ade8055;
      border-radius: 10px;
      box-shadow: 0 0 40px #4ade8022;
      overflow: hidden;
    }

    canvas { display: block; background: #12122a; }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1add;
      border-radius: 8px;
      gap: 14px;
    }

    #overlay h2 { font-size: 2rem; color: #4ade80; text-shadow: 0 0 12px #4ade8099; }
    #overlay p  { color: #a0a0b0; font-size: 0.95rem; }

    #btn-start {
      margin-top: 6px;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #4ade80;
      color: #0f0f1a;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 16px #4ade8066;
    }

    #btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 28px #4ade8099;
    }

    #controls {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: #606070;
      font-size: 0.82rem;
    }

    .key {
      display: inline-block;
      padding: 3px 9px;
      border: 1px solid #40405a;
      border-radius: 4px;
      background: #1c1c30;
      color: #a0a0c0;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>🐍 SNAKE</h1>

  <div id="scoreboard">
    Score: <span id="score">0</span>
    &nbsp;|&nbsp;
    Best: <span id="best">0</span>
    &nbsp;|&nbsp;
    Level: <span id="level">1</span>
  </div>

  <div id="game-wrapper">
    <canvas id="canvas" width="500" height="500"></canvas>
    <div id="overlay">
      <h2>🐍 SNAKE</h2>
      <p>Eat the food. Don't hit the walls.</p>
      <button id="btn-start">START GAME</button>
      <p id="final-score" style="display:none; color:#4ade80; font-size:1.1rem;"></p>
    </div>
  </div>

  <div id="controls">
    <span class="key">↑</span>
    <span class="key">↓</span>
    <span class="key">←</span>
    <span class="key">→</span>
    &nbsp;or&nbsp;
    <span class="key">W</span>
    <span class="key">A</span>
    <span class="key">S</span>
    <span class="key">D</span>
    &nbsp;to move &nbsp;·&nbsp;
    <span class="key">P</span>
    &nbsp;to pause
  </div>

  <script>
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const btnStart     = document.getElementById('btn-start');
    const scoreEl      = document.getElementById('score');
    const bestEl       = document.getElementById('best');
    const levelEl      = document.getElementById('level');
    const finalScoreEl = document.getElementById('final-score');
    const overlayTitle = overlay.querySelector('h2');
    const overlayDesc  = overlay.querySelector('p');

    const GRID   = 20;           // cells
    const CELL   = canvas.width / GRID;
    const COLORS = {
      head:   '#4ade80',
      body:   '#22c55e',
      tail:   '#16a34a',
      food:   '#f87171',
      glow:   '#4ade8044',
      grid:   '#1a1a2e',
    };

    let snake, dir, nextDir, food, score, best, level, speed, loop, paused, running;

    best = parseInt(localStorage.getItem('snakeBest') || '0');
    bestEl.textContent = best;

    function init() {
      snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir     = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score   = 0;
      level   = 1;
      speed   = 150;
      paused  = false;
      running = true;

      scoreEl.textContent = 0;
      levelEl.textContent = 1;

      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function step() {
      if (paused) return;

      dir = { ...nextDir };

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return gameOver();
      }
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;

        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snakeBest', best);
        }

        level = Math.floor(score / 5) + 1;
        levelEl.textContent = level;
        speed = Math.max(60, 150 - (level - 1) * 15);

        clearInterval(loop);
        loop = setInterval(step, speed);

        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#12122a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines (subtle)
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.4;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food glow
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const grad = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL);
      grad.addColorStop(0, '#f8717188');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(food.x * CELL - CELL, food.y * CELL - CELL, CELL * 3, CELL * 3);

      // Food
      ctx.fillStyle = COLORS.food;
      roundRect(ctx, food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);

      // Snake
      snake.forEach((seg, i) => {
        const ratio = i / snake.length;
        if (i === 0) {
          ctx.fillStyle = COLORS.head;
          // Head glow
          const hg = ctx.createRadialGradient(
            seg.x * CELL + CELL / 2, seg.y * CELL + CELL / 2, 1,
            seg.x * CELL + CELL / 2, seg.y * CELL + CELL / 2, CELL
          );
          hg.addColorStop(0, '#4ade8055');
          hg.addColorStop(1, 'transparent');
          ctx.fillStyle = hg;
          ctx.fillRect(seg.x * CELL - 4, seg.y * CELL - 4, CELL + 8, CELL + 8);
          ctx.fillStyle = COLORS.head;
        } else {
          const g = Math.floor(180 - ratio * 80).toString(16).padStart(2, '0');
          ctx.fillStyle = `#22${g}4e`;
        }
        roundRect(ctx, seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, i === 0 ? 5 : 3);

        // Eyes on head
        if (i === 0) {
          ctx.fillStyle = '#0f0f1a';
          const ex = dir.x, ey = dir.y;
          const cx_ = seg.x * CELL + CELL / 2;
          const cy_ = seg.y * CELL + CELL / 2;
          const r = 2.2;
          const offset = 3.5;
          // perpendicular
          const px = -ey, py = ex;
          ctx.beginPath();
          ctx.arc(cx_ + ex * offset + px * offset, cy_ + ey * offset + py * offset, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx_ + ex * offset - px * offset, cy_ + ey * offset - py * offset, r, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function gameOver() {
      running = false;
      clearInterval(loop);

      overlayTitle.textContent = '💀 GAME OVER';
      overlayDesc.style.display  = 'none';
      finalScoreEl.style.display = 'block';
      finalScoreEl.textContent   = `Score: ${score}  |  Best: ${best}`;
      btnStart.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function startGame() {
      overlay.style.display = 'none';
      overlayDesc.style.display  = 'block';
      finalScoreEl.style.display = 'none';
      overlayTitle.textContent   = '🐍 SNAKE';
      btnStart.textContent       = 'START GAME';
      clearInterval(loop);
      init();
      draw();
      loop = setInterval(step, speed);
    }

    btnStart.addEventListener('click', startGame);

    document.addEventListener('keydown', e => {
      if (!running) return;

      switch (e.key) {
        case 'ArrowUp':    case 'w': case 'W':
          if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; break;
        case 'ArrowDown':  case 's': case 'S':
          if (dir.y !== -1) nextDir = { x: 0, y: 1 };  break;
        case 'ArrowLeft':  case 'a': case 'A':
          if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D':
          if (dir.x !== -1) nextDir = { x: 1, y: 0 };  break;
        case 'p': case 'P':
          paused = !paused; break;
      }

      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
    });

    // Initial draw of the board without starting
    (() => {
      ctx.fillStyle = '#12122a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.4;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
      }
    })();
  </script>
</body>
</html>
