<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
      letter-spacing: 3px;
      color: #4ecca3;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 3rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #aaa;
    }

    #scoreboard span { color: #4ecca3; font-weight: bold; font-size: 1.2rem; }

    canvas {
      border: 3px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
    }

    #message {
      margin-top: 1.2rem;
      font-size: 1rem;
      color: #aaa;
      min-height: 1.4rem;
      letter-spacing: 1px;
    }

    #restartBtn {
      display: none;
      margin-top: 1rem;
      padding: 0.6rem 2rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    #restartBtn:hover { background: #38b28d; }
  </style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="scoreboard">
    Score: <span id="score">0</span>&nbsp;&nbsp;Best: <span id="best">0</span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="message">Press any arrow key to start</div>
  <button id="restartBtn" onclick="startGame()">Play Again</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, best, gameLoop, running, started;

    function init() {
      snake = [{ x: 10, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      running = false;
      started = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('message').textContent = 'Press any arrow key to start';
      document.getElementById('restartBtn').style.display = 'none';
      placeFood();
      draw();
    }

    function startGame() {
      if (gameLoop) clearInterval(gameLoop);
      init();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score').textContent = score;
        if (score > best) {
          best = score;
          document.getElementById('best').textContent = best;
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(gameLoop);
      running = false;
      document.getElementById('message').textContent = `Game over! Score: ${score}`;
      document.getElementById('restartBtn').style.display = 'inline-block';
      drawGameOver();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          ctx.fillRect(x * GRID + GRID / 2 - 1, y * GRID + GRID / 2 - 1, 2, 2);
        }
      }

      // Food
      const fx = food.x * GRID + GRID / 2;
      const fy = food.y * GRID + GRID / 2;
      ctx.beginPath();
      ctx.arc(fx, fy, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ff6b6b';
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        const x = seg.x * GRID + 1;
        const y = seg.y * GRID + 1;
        const size = GRID - 2;

        ctx.fillStyle = isHead ? '#4ecca3' : `hsl(160, 60%, ${45 - i * 0.5}%)`;
        roundRect(ctx, x, y, size, size, isHead ? 5 : 3);
        ctx.fill();

        if (isHead) {
          // Eyes
          const ex = dir.x === 0 ? [4, size - 6] : dir.x > 0 ? [size - 5, size - 5] : [3, 3];
          const ey = dir.y === 0 ? [4, 4] : dir.y > 0 ? [size - 5, size - 5] : [3, 3];
          const eyeOffset = dir.x !== 0 ? [[0, 4], [0, size - 8]] : [[4, 0], [size - 8, 0]];
          ctx.fillStyle = '#1a1a2e';
          ctx.beginPath();
          ctx.arc(x + eyeOffset[0][0] + (dir.x > 0 ? size - 6 : dir.x < 0 ? 4 : size / 2 - 3), y + eyeOffset[0][1] + (dir.y > 0 ? size - 6 : dir.y < 0 ? 4 : 4), 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + eyeOffset[1][0] + (dir.x > 0 ? size - 6 : dir.x < 0 ? 4 : size / 2 + 3), y + eyeOffset[1][1] + (dir.y > 0 ? size - 6 : dir.y < 0 ? 4 : 4), 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(22, 33, 62, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 2.5rem Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#4ecca3';
      ctx.font = '1.1rem Segoe UI';
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 28);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    document.addEventListener('keydown', e => {
      const keys = {
        ArrowUp:    { x: 0, y: -1 },
        ArrowDown:  { x: 0, y: 1 },
        ArrowLeft:  { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
      };
      const newDir = keys[e.key];
      if (!newDir) return;
      e.preventDefault();

      // Prevent reversing
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      nextDir = newDir;

      if (!started) {
        started = true;
        running = true;
        document.getElementById('message').textContent = '';
        gameLoop = setInterval(step, 120);
      }
    });

    best = 0;
    init();
  </script>
</body>
</html>
